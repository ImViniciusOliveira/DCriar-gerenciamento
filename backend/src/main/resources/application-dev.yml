spring:
  docker:
    compose:
      enabled: true
  devtools:
    livereload:
      enabled: true
  # --- DATABASE (POSTGRES) ---
  datasource:
    # As propriedades vêm do docker-compose.override.yml
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: none # Flyway vai gerenciar o schema
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # --- FLYWAY MIGRATIONS ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Permite que a estratégia de clean+migrate funcione em desenvolvimento
    clean-disabled: false

# --- MINIO CONFIGURATION ---
minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

# Nível de log para desenvolvimento (ajustado para reduzir SQL no console)
logging:
  level:
    # Mantém o nível geral do Hibernate em WARN (evita info detalhado)
    org.hibernate: WARN
    # Desativa especificamente o logger que imprime SQL formatado
    org.hibernate.SQL: ERROR
    # Desativa logs de valores de parâmetros SQL (pode vazar segredos)
    org.hibernate.type.descriptor.sql: ERROR
    # RequestLoggingFilter reduzido para WARN para evitar flood no console
    com.dcriar.config.RequestLoggingFilter: WARN
    # UploadController e Upload service logs reduzidos para INFO
    com.dcriar.api.controller.upload.UploadController: INFO
    com.dcriar.domain.upload.service.impl.FileStorageServiceImpl: INFO
    com.dcriar.api.controller.product.ProdutoController: INFO
    # Logs da aplicação em INFO por padrão
    com.dcriar: INFO

# --- ATUATOR (DESENVOLVIMENTO) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

