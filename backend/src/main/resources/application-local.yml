# Perfil local: similar ao `dev`, porém desliga a integração automática com docker-compose
# para permitir rodar direto pelo botão "Run" da IDE (IntelliJ) sem depender de arquivos externos.
spring:
  config:
    activate:
      on-profile: local

  # Explicitamente desliga a integração automática (o EnvironmentPostProcessor
  # respeitará essa propriedade caso o profile `local` seja usado na IDE).
  docker:
    compose:
      enabled: false

  devtools:
    livereload:
      enabled: true

  # --- DATABASE (POSTGRES) ---
  datasource:
    # Em `local` a recomendação é configurar as variáveis de ambiente da IDE
    # (ou usar um Postgres local). Mantemos a mesma forma do `dev` para facilitar.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # --- FLYWAY ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

# --- MINIO CONFIGURATION ---
minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

# Logging similar ao dev
logging:
  level:
    org.hibernate: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql: ERROR
    com.dcriar.config.RequestLoggingFilter: WARN
    com.dcriar.api.controller.upload.UploadController: INFO
    com.dcriar.domain.upload.service.impl.FileStorageServiceImpl: INFO
    com.dcriar.api.controller.product.ProdutoController: INFO
    com.dcriar: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

# --- CORS CONFIGURATION ---
cors:
  allowed-origin: "http://localhost:4200"
