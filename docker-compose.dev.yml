# Este compose é para DESENVOLVIMENTO.
# Ele sobe apenas os serviços (banco, MinIO), pois a API e o Front
# serão executados diretamente da sua IDE/editor para agilizar o desenvolvimento.

services:
  postgres-dev:
    image: postgres:14-alpine
    container_name: postgres-dev
    ports:
      - "5432:5432" # Expõe a porta do Postgres para a sua máquina local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dcriar-net

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000" # API do MinIO
      - "9001:9001" # Console Web do MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - dcriar-net

  minio-mc:
    image: minio/mc:latest
    container_name: minio-mc-dev
    depends_on:
      - minio-dev
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando o MinIO estar completamente pronto...'; 
      /usr/bin/mc config host add minio http://minio-dev:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; 
      until /usr/bin/mc ls minio > /dev/null 2>&1; do 
        echo 'MinIO ainda não está pronto. Tentando novamente em 2 segundos...'; 
        sleep 2; 
      done; 
      set -e; 
      echo 'MinIO está pronto. Criando bucket ${MINIO_BUCKET_NAME}...'; 
      /usr/bin/mc mb minio/${MINIO_BUCKET_NAME} --ignore-existing; 
      echo 'Configurando política pública para o bucket ${MINIO_BUCKET_NAME}...'; 
      /usr/bin/mc policy set public minio/${MINIO_BUCKET_NAME}; 
      echo 'Configuração do MinIO concluída.'; 
      exit 0;"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    networks:
      - dcriar-net

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  dcriar-net:
    driver: bridge
