# Este compose é para DESENVOLVIMENTO.
# Ele sobe apenas os serviços (banco, MinIO), pois a API e o Front
# serão executados diretamente da sua IDE/editor para agilizar o desenvolvimento.
#
# Variável opcional:
#   DEV_ENV_FILE - caminho para o arquivo de variáveis de ambiente usado pelo compose.
#                 Padrão: ./.env.dev (arquivo no diretório do projeto)

services:
  postgres-dev:
    image: postgres:14-alpine
    container_name: postgres-dev
    env_file: ${DEV_ENV_FILE:-./.env.dev}
    ports:
      - "5432:5432" # Expõe a porta do Postgres para a sua máquina local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dcriar-net

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    env_file: ${DEV_ENV_FILE:-./.env.dev}
    ports:
      - "9000:9000" # API do MinIO
      - "9001:9001" # Console Web do MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - dcriar-net

  # Init service que cria bucket e política usando 'mc' - roda uma única vez após minio-dev subir.
  # Substitui o uso do script externo ./scripts/wait-for-minio.sh para evitar dependência de arquivo.
  minio-init:
    build:
      context: ./docker/minio-init
      dockerfile: Dockerfile
    container_name: minio-init
    depends_on:
      - minio-dev
    restart: "no"
    env_file: ${DEV_ENV_FILE:-./.env.dev}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_HOST: ${MINIO_HOST:-minio-dev}
      MINIO_PORT: ${MINIO_PORT:-9000}
      WAIT_TIMEOUT: ${WAIT_TIMEOUT:-60}
    networks:
      - dcriar-net

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  dcriar-net:
    driver: bridge
