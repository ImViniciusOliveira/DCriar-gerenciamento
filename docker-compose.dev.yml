# Este compose é para DESENVOLVIMENTO.
# Ele sobe apenas os serviços (banco, MinIO), pois a API e o Front
# serão executados diretamente da sua IDE/editor para agilizar o desenvolvimento.
#
# Variável opcional:
#   DEV_ENV_FILE - caminho para o arquivo de variáveis de ambiente usado pelo compose.
#                 Padrão: ./.env.dev (arquivo no diretório do projeto)

services:
  postgres-dev:
    image: postgres:14-alpine
    container_name: postgres-dev
    env_file: ${DEV_ENV_FILE}
    ports:
      - "${POSTGRES_PORT_DEV}:5432" # Expõe a porta do Postgres para a sua máquina local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - dcriar-net

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    env_file: ${DEV_ENV_FILE}
    ports:
      - "${MINIO_PORT_DEV}:9000" # API do MinIO
      - "${MINIO_CONSOLE_PORT_DEV}:9001" # Console Web do MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - dcriar-net

  # Serviço de inicialização renomeado para consistência com 'minio-setup' de prod
  minio-setup-dev:
    image: minio/mc
    container_name: minio-setup-dev
    depends_on:
      - minio-dev
    restart: "no"
    env_file: ${DEV_ENV_FILE}
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      WAIT_TIMEOUT: ${WAIT_TIMEOUT}
      WAIT_INTERVAL: ${WAIT_INTERVAL}
    networks:
      - dcriar-net
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |-
        echo 'Esperando o MinIO-dev ficar online...';
        # Tempo total de espera (segundos) e intervalo entre tentativas (segundos)
        TIMEOUT=$${WAIT_TIMEOUT:-60};
        INTERVAL=$${WAIT_INTERVAL:-5};
        ATTEMPTS=0;
        MAX=$$(( (TIMEOUT + INTERVAL - 1) / INTERVAL ));
        until (/usr/bin/mc alias set dcriar-minio-dev http://$${MINIO_HOST}:$${MINIO_PORT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do
          ATTEMPTS=$$((ATTEMPTS+1));
          echo "...tentando novamente (tentativa: $${ATTEMPTS})";
          if [ "$${ATTEMPTS}" -ge "$${MAX}" ]; then
            echo "Timeout de $${TIMEOUT}s atingido ao tentar conectar ao MinIO-dev. Saindo com erro.";
            exit 1;
          fi;
          sleep $${INTERVAL};
        done;
        echo 'MinIO-dev está online. Configurando bucket...';
        /usr/bin/mc mb dcriar-minio-dev/$${MINIO_BUCKET_NAME} --ignore-existing;
        echo 'Bucket criado ou já existente.';
        /usr/bin/mc policy set public dcriar-minio-dev/$${MINIO_BUCKET_NAME};
        echo 'Política do bucket definida como public.';
        exit 0;

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  dcriar-net:
    driver: bridge
