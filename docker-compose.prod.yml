services:
  postgres-prod:
    image: postgres:14-alpine
    container_name: postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - dcriar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: always

  minio-prod:
    image: minio/minio:latest
    container_name: minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data
    networks:
      - dcriar-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: always

  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      minio-prod:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    networks:
      - dcriar-net
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |-
        echo 'Esperando o MinIO ficar online...';
        until (/usr/bin/mc alias set dcriar-minio http://minio-prod:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}) do
          echo '...tentando novamente' && sleep 1;
        done;
        echo 'MinIO está online. Configurando bucket...';
        /usr/bin/mc mb dcriar-minio/$${MINIO_BUCKET_NAME} --ignore-existing;
        echo 'Bucket criado ou já existente.';
        /usr/bin/mc policy set public dcriar-minio/$${MINIO_BUCKET_NAME};
        echo 'Política do bucket definida como public (leitura pública).';
        exit 0;

  backend:
    # Usa APP_VERSION para versionar imagem
    image: ${DOCKER_REGISTRY_USER}/${BACKEND_IMAGE_NAME}:${APP_VERSION}
    container_name: backend-api
    depends_on:
      postgres-prod:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - dcriar-net
    restart: always

  frontend:
    image: ${DOCKER_REGISTRY_USER}/${FRONTEND_IMAGE_NAME}:${APP_VERSION}
    container_name: frontend-app
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - dcriar-net
    restart: always

volumes:
  postgres_data_prod:
  minio_data_prod:

networks:
  dcriar-net:
    driver: bridge
