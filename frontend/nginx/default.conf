# nginx/default.conf - configuração otimizada para SPA Angular
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable directory listing
    autoindex off;

    # Healthcheck endpoint (simple)
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Serve hashed static assets with long cache
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Do not heavily cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate, private" always;
        try_files /index.html =404;
    }

    # Fallback for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/xml;
    gzip_min_length 1000;
    gzip_comp_level 5;
}

