<h2 mat-dialog-title>{{ data.title }}</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <mat-dialog-content>
    <!-- Container para o grupo de filtros -->
    <div class="filter-group-container">
      <div class="form-content-wrapper">
        <!-- Linha 1: Controles principais -->
        <div class="form-row">
          <div class="product-search-field">
            <app-product-stock-search
              [control]="produtoControl"
              [isEditMode]="false"
              [productType]="tipoProducaoControl.value || null"
              (selectionChange)="onProdutoChange($event)">
            </app-product-stock-search>
          </div>

          <mat-form-field appearance="outline" class="quantity-field">
            <mat-label>Qtd.</mat-label>
            <input matInput type="text" formControlName="quantidade">
          </mat-form-field>

          <mat-form-field appearance="outline" class="production-type-field">
            <mat-label>Tipo de Produção</mat-label>
            <mat-select formControlName="tipoProducao" (selectionChange)="onTipoProducaoManualChange()">
              <mat-select-trigger>
                @switch (tipoProducaoControl.value) {
                  @case ('') { Todos }
                  @case ('CORTE') { Corte }
                  @case ('CONSUMO_DIRETO') { Consumo Direto }
                }
              </mat-select-trigger>
              <mat-option value="">Todos</mat-option>
              <mat-option value="CORTE">Corte</mat-option>
              <mat-option value="CONSUMO_DIRETO">Consumo Direto</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Linha 2 - Seção para input de CORTE -->
        @if (showCorteInputs()) {
          <div class="form-row">
            <div class="batch-search-field">
              <app-batch-search
                [control]="loteIdControl"
                [tipoMateriaPrimaId]="produto()?.materiaPrima?.id || null"
                (selectionChange)="onLoteChange($event)">
              </app-batch-search>
            </div>
          </div>
        }

        <!-- Linha 2 - Seção para input de CONSUMO DIRETO -->
        @if (showConsumoInputs()) {
          <div class="form-row">
            <div class="consumption-placeholder-field">
              <mat-form-field appearance="outline">
                <mat-label>Placeholder para Seleção de Lotes (CONSUMO)</mat-label>
                <input matInput value="Seleção de Múltiplos Lotes" readonly>
              </mat-form-field>
            </div>
          </div>
        }
      </div>

      <!-- Botão de Ação -->
      <button mat-stroked-button type="button" class="action-button" (click)="onSimulate()">
        <mat-icon>model_training</mat-icon>
        Simular
      </button>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
      Cancelar
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
      @if (isSaving()) { <mat-spinner diameter="20"></mat-spinner> } @else { Salvar }
    </button>
  </mat-dialog-actions>
</form>
