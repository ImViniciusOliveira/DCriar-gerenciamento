<h2 mat-dialog-title>{{ data.title }}</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <mat-dialog-content>
    <!-- Linha 1: Dropdown Produto -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Produto</mat-label>
      <mat-select formControlName="produtoId">
      </mat-select>
    </mat-form-field>

    <!-- Linha 2: Botão Toggle (≥/≤) + Input Filtro -->
    <div style="display: flex; gap: 10px;">
      <button mat-stroked-button type="button" (click)="toggleFilterOperator()">
        {{ filterOperator() === 'GTE' ? '≥' : '≤' }}
      </button>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Filtro Estoque</mat-label>
        <input matInput formControlName="filtroEstoque">
      </mat-form-field>
    </div>

    <!-- Linha 3: Input Quantidade -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantidade</mat-label>
      <input matInput formControlName="quantidade">
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
      Cancelar
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
      @if (isSaving()) { <mat-spinner diameter="20"></mat-spinner> } @else { Salvar }
    </button>
  </mat-dialog-actions>
</form>
