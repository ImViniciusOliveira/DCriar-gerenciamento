<h2 mat-dialog-title>{{ data.title }}</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <mat-dialog-content>
    <div class="form-grid">
      <!-- Seleção de Canal de Venda -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Canal de Venda</mat-label>
        <mat-select formControlName="canalVendaId">
          @for (channel of channels(); track channel.id) {
            <mat-option [value]="channel.id">{{ channel.nome }}</mat-option>
          }
        </mat-select>
        <mat-error *ngIf="form.get('canalVendaId')?.hasError('required')">
          Selecione um canal de venda.
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Lista de Itens -->
    <fieldset class="items-section">
      <legend>Itens da Venda</legend>

      <div formArrayName="itens">
        @for (itemGroup of itemsControls; track $index) {
          <div class="item-row" [formGroup]="itemGroup">
            <!-- Componente de Busca de Produto -->
            <div class="product-field">
              <app-product-search
                [searchControl]="getProductControl($index)"
                (productSelected)="onProductSelected($event, $index)">
              </app-product-search>
            </div>

            <!-- Quantidade -->
            <mat-form-field appearance="outline" class="qty-field">
              <mat-label>Qtd</mat-label>
              <input matInput type="number" formControlName="quantidade" min="1">
            </mat-form-field>

            <!-- Botão Remover -->
            <button mat-icon-button color="warn" type="button" (click)="removeItem($index)" title="Remover item">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        }

        @if (itemsControls.length === 0) {
          <div class="empty-state">
            <p>Nenhum item adicionado.</p>
          </div>
        }
      </div>

      <button mat-stroked-button type="button" (click)="addItem()">
        <mat-icon>add_shopping_cart</mat-icon>
        Adicionar Produto
      </button>
    </fieldset>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSaving()">
      @if (isSaving()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        Finalizar Venda
      }
    </button>
  </mat-dialog-actions>
</form>
