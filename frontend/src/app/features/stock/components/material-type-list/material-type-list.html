<!-- Contêiner principal que estrutura o diálogo com flexbox. -->
<div class="dialog-container">
  <!-- Cabeçalho fixo com título e botão de ação. -->
  <div class="page-header">
    <div class="header-title">
      <h2>Matérias-Primas</h2>
      <p>Gerenciamento de tipos de matérias-primas</p>
    </div>
    <button mat-raised-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      Adicionar Matéria-Prima
    </button>
  </div>

  <!-- Contêiner do conteúdo, que é a única área com scroll. -->
  <div class="content-container">
    <app-base-table
      [items]="items()"
      [columns]="tableColumns"
      [totalElements]="pagination.totalElements()"
      [pageSize]="pagination.pageSize()"
      [pageIndex]="pagination.pageIndex()"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)">
    </app-base-table>
  </div>
</div>

<!-- Definição dos templates para as células da tabela. -->
<ng-template #nameTemplate let-item>{{ item.nome }}</ng-template>
<ng-template #unitTemplate let-item>{{ item.unidadeDescricao }}</ng-template>
<ng-template #createdAtTemplate let-item>{{ item.dataCriacao ? (item.dataCriacao | date:'dd/MM/yyyy HH:mm') : 'N/A' }}</ng-template>
<ng-template #updatedAtTemplate let-item>{{ item.dataAtualizacao ? (item.dataAtualizacao | date:'dd/MM/yyyy HH:mm') : 'N/A' }}</ng-template>
<ng-template #actionsTemplate let-item>
  <button mat-icon-button color="primary" (click)="onEdit(item)">
    <mat-icon>edit</mat-icon>
  </button>
  <button mat-icon-button color="warn" (click)="onDelete(item)">
    <mat-icon>delete</mat-icon>
  </button>
</ng-template>
