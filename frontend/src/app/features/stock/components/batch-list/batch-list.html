<app-base-table
  [title]="'Lotes'"
  [subtitle]="'Gerenciamento de Lotes'"
  [addButtonText]="'Adicionar Lote'"
  [items]="items()"
  [columns]="tableColumns"
  [totalElements]="pagination.totalElements()"
  [pageSize]="pagination.pageSize()"
  [pageIndex]="pagination.pageIndex()"
  (add)="onCreate()"
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)">

  <div secondary-actions>
    <button mat-stroked-button (click)="openMaterialTypeDialog()" class="secondary-action-button">
      <mat-icon>view_list</mat-icon>
      Exibir Matérias-Primas
    </button>
  </div>

</app-base-table>

<!-- Templates para células da tabela de lotes -->
<ng-template #idTemplate let-lote>{{ lote.id }}</ng-template>
<ng-template #tipoTemplate let-lote>{{ lote.tipoMateriaPrima?.nome }}</ng-template>
<ng-template #saldoTemplate let-lote>{{ lote.saldoEstoque }}</ng-template>
<ng-template #unidadeTemplate let-lote>{{ lote.unidadeDeEstoque }}</ng-template>
<ng-template #dataCriacaoTemplate let-lote>{{ lote.dataCriacao | date:'short' }}</ng-template>
<ng-template #acoesTemplate let-lote>
  <button mat-icon-button color="primary" (click)="editLote(lote)">
    <mat-icon>edit</mat-icon>
  </button>
  <button mat-icon-button color="warn" (click)="deleteLote(lote)">
    <mat-icon>delete</mat-icon>
  </button>
</ng-template>
