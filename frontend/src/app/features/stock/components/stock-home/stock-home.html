<div class="page-container">
  <div class="page-header">
    <div class="header-title">
      <h2>{{ activeSection().title }}</h2>
      <p>{{ activeSection().subtitle }}</p>
    </div>

    <div class="header-actions">
      @for (section of sections; track section.key) {
        <button
          mat-stroked-button
          type="button"
          class="stock-home__tab-button"
          [class.stock-home__tab-button--active]="activeSection().key === section.key"
          (click)="setActiveSection(section)">
          {{ section.buttonLabel }}
        </button>
      }
    </div>
  </div>

  <div class="stock-home__content">
    <div class="stock-home__placeholder">
      {{ activeSection().key }} works
    </div>
  </div>
</div>
