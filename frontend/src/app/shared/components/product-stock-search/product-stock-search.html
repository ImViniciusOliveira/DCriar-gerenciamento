<div class="filters-container">

  <mat-form-field appearance="outline" class="flex-grow">
    <mat-label>Buscar Produto</mat-label>
    <input type="text"
           matInput
           [required]="isRequired"
           [formControl]="searchControl"
           [matAutocomplete]="auto"
           placeholder="Busque por nome...">

    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onOptionSelected($event)" (opened)="onAutocompleteOpened()">
      @for (product of products(); track product.id) {
        <mat-option [value]="product">
          {{ product.nome }} (Estoque: {{ product.estoqueFisicoTotal || 0 }})
        </mat-option>
      }

      @if (isSearching()) {
        <mat-option disabled class="spinner-option">
          <mat-spinner diameter="20"></mat-spinner>
        </mat-option>
      }
    </mat-autocomplete>

    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <!-- Filtro de Estoque com toggle dentro do input (Modernizado) -->
  <mat-form-field appearance="outline" class="filter-input" subscriptSizing="dynamic">
    <mat-label>Estoque</mat-label>
    <button mat-icon-button matPrefix type="button" (click)="toggleFilterOperator()"
            [ngClass]="{
              'btn-danger-custom': filterOperatorControl.value === 'LTE',
              'btn-success-custom': filterOperatorControl.value === 'GTE'
            }">
      {{ filterOperatorControl.value === 'GTE' ? '≥' : '≤' }}
    </button>
    <input matInput [formControl]="filterValueControl">
  </mat-form-field>

</div>
