<div class="table-card">
  <div class="table-wrapper">
    <!--
      A fonte de dados da tabela é o `dataSource`.
      As colunas são definidas dinamicamente com base no sinal `columns()`.
    -->
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      [matSortActive]="sortActive()"
      [matSortDirection]="sortDirection()"
      (matSortChange)="onSortChange($event)">
      <colgroup>
        @for (column of columns(); track column.key) {
          <col [style.width]="getColumnWidth(column)" [style.min-width]="getColumnWidth(column)" [style.max-width]="getColumnWidth(column)">
        }
      </colgroup>
      <!-- O loop `@for` agora itera sobre o valor do sinal `columns()`. -->
      @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef [mat-sort-header]="column.sortKey || column.key" [disabled]="!column.sortable" [ngClass]="column.className" [ngStyle]="getColumnWidthStyle(column)">
            <span class="sort-header-content">
              <span>{{ column.header }}</span>
              @if (column.sortable) {
                <mat-icon class="sort-state-icon">{{ getSortIcon(column) }}</mat-icon>
              }
            </span>
          </th>
          <td mat-cell *matCellDef="let item" [ngClass]="column.className" [ngStyle]="getColumnWidthStyle(column)">
            <div class="cell-content">
              <ng-container
                [ngTemplateOutlet]="column.cellTemplate"
                [ngTemplateOutletContext]="{ $implicit: item }">
              </ng-container>
            </div>
          </td>
        </ng-container>
      }
      <!-- As definições de linha agora leem o valor do sinal computado `columnKeys()`. -->
      <tr mat-header-row *matHeaderRowDef="columnKeys(); sticky: true"></tr>
      <tr mat-row *matRowDef="let _row; columns: columnKeys()"></tr>
    </table>
  </div>

  <!--
    O paginador agora é totalmente controlado por Sinais.
    Cada propriedade (`length`, `pageSize`, `pageIndex`) lê o valor do seu respectivo sinal.
  -->
  <mat-paginator
    [length]="totalElements()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="onPageChange($event)"
    [attr.aria-label]="'Selecione a página'">
  </mat-paginator>
</div>
