<mat-card class="page-card">
  <mat-card-header>
    <div>
      <mat-card-title>{{ title }}</mat-card-title>
      <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
    </div>
    <span class="header-spacer"></span>
    <button mat-raised-button color="primary" class="add-button" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      {{ addButtonText }}
    </button>
  </mat-card-header>
  <mat-card-content>
    <div class="table-wrapper">
      <div class="mat-elevation-z8 table-container">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)">
          <!-- Colunas Dinâmicas -->
          @for (column of columns; track column.key) {
            <ng-container [matColumnDef]="column.key">
              <th mat-header-cell *matHeaderCellDef [mat-sort-header]="column.sortKey || column.key" [disabled]="!column.sortable">
                {{ column.header | titlecase }}
              </th>
              <td mat-cell *matCellDef="let item">
                <ng-container
                  [ngTemplateOutlet]="column.cellTemplate"
                  [ngTemplateOutletContext]="{ $implicit: item }">
                </ng-container>
              </td>
            </ng-container>
          }
          <tr mat-header-row *matHeaderRowDef="columnKeys; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: columnKeys"></tr>
        </table>
      </div>
    </div>
  </mat-card-content>
  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 25, 100]"
    (page)="onPageChange($event)"
    [attr.aria-label]="paginatorAriaLabel">
  </mat-paginator>
</mat-card>
