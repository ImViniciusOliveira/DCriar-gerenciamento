<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="details-dialog-content">
  @if (data.items.length) {
    <div class="details-list">
      @for (item of data.items; track $index) {
        <div class="details-row">
          @if (data.showLabels !== false && item.label) {
            <span class="details-label">{{ item.label }}:</span>
          }
          <span class="details-value">{{ item.value }}</span>
        </div>
      }
    </div>
  } @else {
    <p class="details-empty">Nenhuma informação disponível.</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Fechar</button>
</mat-dialog-actions>
