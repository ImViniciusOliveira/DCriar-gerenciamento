<mat-toolbar>
  <a routerLink="/dashboard" class="home-link">
    <span>DCriar</span>
  </a>

  <span class="spacer"></span>

  <!--
    O loop @for agora itera sobre o valor do sinal computado `availableNavLinks()`.
    Isso garante que a navegação seja atualizada reativamente quando os endpoints da API mudarem.
  -->
  @for (link of availableNavLinks(); track link.path) {
    <a mat-button [routerLink]="link.path" class="nav-link">
      @if(link.icon) {
        <mat-icon>{{ link.icon }}</mat-icon>
      }
      <span>{{ link.label }}</span>
    </a>
  }
</mat-toolbar>
